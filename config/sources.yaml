# 來源連線設定（P1-T01 決定：連線設定放 repo，以來源代碼對應）。
#
# - 只能登記 docs/governance/source-inventory.md 中「核准」的來源（測試會檢查）。
# - 授權狀態與啟用與否以資料庫 sources 表為準，這裡只放 Adapter 類型與 options。
# - name、poll_interval（秒）只在 `make sources`（sync_sources）建立資料列時使用；
#   之後以資料庫為準，不會覆寫管理者的調整。
# - 不得放金鑰：需要授權碼的來源由 Adapter 從環境變數讀取。
# - 各類型的 options 見 backend/app/ingestion/adapters/ 中對應模組的說明。

sources:
  ncu-announcements:  # 中央大學校園公告（RPage，表格版型）
    type: rpage
    name: 中央大學校園公告
    poll_interval: 1800  # 來源盤點建議：每 30 分鐘
    options:
      list_url: https://www.ncu.edu.tw/p/403-1000-15-1.php?Lang=zh-tw

  ncu-sec:  # 秘書室公告（RPage，listBS 版型）
    type: rpage
    name: 中央大學秘書室公告
    poll_interval: 3600  # 每 60 分鐘
    options:
      list_url: https://sec.ncu.edu.tw/p/403-1007-281-1.php?Lang=zh-tw

  ncu-oia:  # 國際事務處最新公告（RPage，表格版型、無欄位標籤）
    type: rpage
    name: 中央大學國際事務處最新公告
    poll_interval: 21600  # 每 6 小時
    options:
      list_url: https://oia.ncu.edu.tw/p/403-1026-342.php?Lang=zh-tw

  ncu-aa:  # 教務處：總公告（495）與課務組（498，停課、補課）；同站台共用文章編號
    type: rpage
    name: 中央大學教務處最新消息
    poll_interval: 3600  # 每 60 分鐘
    options:
      list_urls:
        - url: https://pdc.adm.ncu.edu.tw/p/403-1019-495-1.php?Lang=zh-tw
          tag: 教務處
        - url: https://pdc.adm.ncu.edu.tw/p/403-1019-498-1.php?Lang=zh-tw
          tag: 課務組

  ncu-news:  # 中央大學新聞網：中大新聞、焦點新聞、學術新聞（主要新聞來源，ADR-0007）
    type: ncu_news
    name: 中央大學新聞網
    poll_interval: 21600  # 來源盤點建議：每 6 小時
    options:
      list_urls:  # 三個列表共用文章編號 H_ID，跨列表去重
        - https://ncusec.ncu.edu.tw/news/headlines.php
        - https://ncusec.ncu.edu.tw/news/focus-news.php
        - https://ncusec.ncu.edu.tw/news/academic-news.php

  ncu-cc:  # 電子計算機中心公告（RPage，9 個分類共用文章編號；使用者要求全部擷取，ADR-0010；tag 寫入 tags，P1-T15）
    type: rpage
    name: 中央大學電子計算機中心公告
    poll_interval: 3600  # 來源盤點建議：每 60 分鐘
    options:
      list_urls:
        - url: https://www.cc.ncu.edu.tw/p/403-1033-14-1.php?Lang=zh-tw
          tag: 行政公告
        - url: https://www.cc.ncu.edu.tw/p/403-1033-15-1.php?Lang=zh-tw
          tag: 系統維護
        - url: https://www.cc.ncu.edu.tw/p/403-1033-16-1.php?Lang=zh-tw
          tag: 宿舍網路
        - url: https://www.cc.ncu.edu.tw/p/403-1033-17-1.php?Lang=zh-tw
          tag: 資安訊息
        - url: https://www.cc.ncu.edu.tw/p/403-1033-18-1.php?Lang=zh-tw
          tag: 授權軟體
        - url: https://www.cc.ncu.edu.tw/p/403-1033-19-1.php?Lang=zh-tw
          tag: 虛擬桌面
        - url: https://www.cc.ncu.edu.tw/p/403-1033-20-1.php?Lang=zh-tw
          tag: 徵才公告
        - url: https://www.cc.ncu.edu.tw/p/403-1033-21-1.php?Lang=zh-tw
          tag: 最新消息
        - url: https://www.cc.ncu.edu.tw/p/403-1033-22-1.php?Lang=zh-tw
          tag: 課程／活動

  ncu-epsc:  # 環境保護暨安全衛生中心最新消息（實驗室、化學品、消防安全；ADR-0010）
    type: ncu_epsc
    name: 中央大學環境保護暨安全衛生中心最新消息
    poll_interval: 3600  # 來源盤點建議：每 60 分鐘
    options:
      list_url: https://ncu.edu.tw/epsc/index.php/index/News.html

  ncu-lib:  # 圖書館最新消息（閉館、設施維修；ADR-0010）
    type: ncu_lib
    name: 中央大學圖書館最新消息
    poll_interval: 3600  # 每 60 分鐘
    options:
      list_url: https://www.lib.ncu.edu.tw/libboard/board_all.php

  ncu-osa-life:  # 學務處生活輔導組公告（校園安全、交通安全、宿舍；ADR-0010）
    type: ncu_osa_life
    name: 中央大學學務處生活輔導組公告
    poll_interval: 3600  # 每 60 分鐘
    options:
      list_url: https://military.ncu.edu.tw/

  facebook:  # Facebook NCU 社團（ADR-0008、P1-T13）：每天 08:00 由 Claude Code 透過 Chrome 擷取，經人工匯入格式進入系統
    type: manual_import
    name: Facebook NCU 社團
    poll_interval: 3600  # 每 60 分鐘檢查一次資料夾；擷取本身每天一次
    options:
      directory: raw/facebook  # data/raw/facebook/，不進 git
      source_url: https://www.facebook.com/groups/NCUgroup  # 擷取 skill 讀取；不帶 locale 等參數
      derive_external_id: true  # ADR-0011：取不到單篇網址，以內文雜湊識別

  cwa-alerts:  # 中央氣象署開放資料：天氣警特報（W-C0033-001）與顯著有感地震報告（E-A0015-001）
    type: cwa_open_data
    name: 中央氣象署天氣警特報與地震報告
    poll_interval: 600  # 來源盤點建議：每 10 分鐘
    options:
      county: 桃園市  # 授權碼由環境變數 CWA_API_KEY 提供，不寫在這裡
