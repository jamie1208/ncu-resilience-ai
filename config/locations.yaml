# 校園代表地點清單（P8-T14，使用者 2026-11-05 確認）。
# 由 backend/app/locations/seed.py 匯入 locations：name 建立為代表地點，aliases 建立為指向它的別名。
# 匯入後同名稱直接沿用、不呼叫 S13；清單外的新名稱仍由 S13 判斷（alias_of 時記成別名，new 時新增代表地點）。
# 「全校」「校外」是 S02 的特殊值，不放在清單中。
#
# 來源：
#   - 地圖：中央大學校園導覽圖（地圖）2024-08 版的編號與正式名稱，code 為平面圖代號
#     https://erp.mgt.ncu.edu.tw/wp-content/uploads/2024/12/01-中央大學校園導覽圖-（地圖）-202408.pdf
#   - 事件：資料庫 locations 現有 7 個名稱（2026-11-05）
# 欄位：
#   name       正式名稱（地圖上的寫法）
#   code       平面圖代號（課表教室代號的字首，例如 E6-A204），沒有就省略
#   aliases    地圖上的括號名稱、現有事件資料已出現的名稱、常用簡稱（使用者 2026-11-05 確認）
#   parent     上層地點（inside_of，只用於篩選、不併入計數），沒有就省略
#
# 修改清單時更新 list_version。

list_version: "2026-11-05.1"

locations:
  # ---------- 行政服務 ----------
  - {name: 行政大樓, code: A1, aliases: [行政]}
  - name: 總圖書館
    code: L2  # 中正圖書館的代號 L 也算這裡
    aliases: [圖書館, 中正圖書館, 舊圖書館, 總圖, 舊圖, 中正圖]  # 使用者決定：總圖與中正圖書館算同一個地點
  - {name: 國鼎圖書資料館, code: L3, aliases: [國鼎圖書館]}
