# 公開規則（P5-T10，ADR-0015；P8-T06 起依 ADR-0018、ADR-0020 放寬）
# 由 backend/app/publishing/policy.py 讀取；規則是確定性的，不呼叫模型。
# 這裡只有可調整的設定。硬性邊界寫在程式裡，這個檔案無法關閉，加上任何其他欄位都會被拒絕：
# - 不是 false 的事件公開 AI 摘要；未經官方來源或使用者查證的一律標「尚未查證」；
# - 疑似指控照 AI 摘要公開，必定在通知中心提醒並附一鍵下架（指控規則沿用 config/notification-policy.yaml）；
# - 推測的規律與原因只出現在系列分析頁，一律標「推測，尚未查證」，首次公開或改變時必定提醒；
# - Facebook 與匿名投稿只公開 AI 摘要，不放原文、逐字證據與連結；
# - 公開內容一律經 PII 遮蔽。
# 修改後請更新 policy_version，公開紀錄會記下判斷時使用的版本。
# P8-T06 移除 safety_notice_levels：未經證實的事件不再改寫成中性安全提醒，不分風險等級都公開 AI 摘要。

policy_version: "2026-11-10.1"

# 不公開的事件類別（none 表示非事件）
excluded_event_types: [none]
