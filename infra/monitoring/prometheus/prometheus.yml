# Prometheus 設定（P5-T04）。只在 Docker 內部網路抓取 api 與 worker 的 /metrics（NCU_METRICS_PORT=9100），
# 指標埠不發布到主機；Prometheus 自己只綁 127.0.0.1:9090。
# 不設定 Alertmanager：告警只在 Prometheus／Grafana 顯示，系統不對外寄送通知（AGENTS.md）。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
