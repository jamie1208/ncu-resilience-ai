# 公開閘道（P5-T15，ADR-0015）：通道唯一的轉送目標。
# 白名單：公開網站頁面、雜湊靜態資源、/api/v1/public/*；其他一律 404，
# 包括 /admin、/api/v1/admin/*、/api/v1/auth/*（登入）、/api/v1/health、/docs、/metrics。
# 管理端只能從本機 127.0.0.1:8088 進入，不經本閘道。

# 用戶端位址：Cloudflare 在邊緣覆寫 CF-Connecting-IP，使用者自帶的值不會到這裡。
# 本機直接連閘道（驗證用）時沒有這個標頭，退回連線位址。
map $http_cf_connecting_ip $ncu_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# 閘道層限速：在進入 API 之前擋下洪水請求；計數只在記憶體，不寫日誌。
limit_req_zone $ncu_client zone=public:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    # 匿名投稿者不可被追蹤（threat-model-public.md）：不記存取日誌。
    # 錯誤日誌裡的 client 是通道容器的位址，不是使用者的位址。
    access_log off;

    # Docker 內建 DNS：web／api 重啟換 IP 後仍能解析
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 16k;
    limit_req zone=public burst=40 nodelay;
    limit_req_status 429;

    # 編碼過的點、斜線與重複斜線一律拒絕，不讓路徑在上游被解讀成別的地方
    if ($request_uri ~* "(%2e|%2f|%5c|\.\.|//)") {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $ncu_client;
    proxy_set_header X-Request-ID "";
    proxy_set_header Cookie "";
    proxy_set_header User-Agent "";
    proxy_set_header Referer "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # 公開網站頁面（frontend/src/public/routes.ts）：交給 web 回傳 index.html
    location = / {
        limit_except GET { deny all; }
        set $web http://web:80;
        proxy_pass $web;
    }

    location ~ ^/(events(/[A-Za-z0-9_-]+)?|progress|resilience|about|report)/?$ {
        limit_except GET { deny all; }
        set $web http://web:80;
        proxy_pass $web;
    }

    # 雜湊檔名的靜態資源（/assets 本身不自動轉址到目錄）
    location = /assets {
        return 404;
    }

    location ^~ /assets/ {
        limit_except GET { deny all; }
        set $web http://web:80;
        proxy_pass $web;
    }

    # 公開 API：直接轉給 api；GET 讀取、POST 只用於匿名回報（後端另有驗證）
    location ^~ /api/v1/public/ {
        limit_except GET POST { deny all; }
        set $api http://api:8000;
        proxy_pass $api;
        # 下架需即時生效（G5-7）：通道邊緣不快取；瀏覽器仍依 API 的 max-age=30
        add_header Cloudflare-CDN-Cache-Control no-store always;
        # location 內有 add_header 時不繼承 server 層的設定，需重列
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # 白名單以外全部拒絕
    location / {
        return 404;
    }
}
