# NCU Resilience AI 本機開發環境（P0-T04）。
# 用法：在 repo 根目錄執行 make up／make down（見 Makefile）。
# 所有對外埠號只綁定 127.0.0.1；設定與金鑰來自根目錄的 .env（範例見 .env.example）。
name: ncu-resilience

x-backend: &backend
  build:
    context: ../../backend
  env_file: ../../.env
  environment:
    # 容器內以服務名稱連線資料庫（主機上預設 localhost）
    NCU_DB_HOST: db
    NCU_DB_PORT: "5432"
    # Celery broker：容器內以服務名稱連線 Redis（P1-T07）
    NCU_REDIS_URL: redis://redis:6379/0
  volumes:
    # alembic.ini 的 script_location 指向 /app/../infra/migrations
    - ../migrations:/infra/migrations:ro
    # 來源連線設定（P1-T07）：app/ingestion/source_settings.py 預設讀 /config/sources.yaml
    - ../../config:/config:ro
    # 產品 Skills（P4-T07）：app/ai/runner/loader.py 預設讀 /skills
    - ../../skills:/skills:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  # Celery worker（P1-T07）：執行擷取任務。只開一個行程，讓每網域限速在行程內生效。
  # 隨 make up 啟動後就會定時擷取已同步（make sources）且核准、啟用的來源。
  worker:
    <<: *backend
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      # 與 x-backend 相同的掛載，另外唯讀掛載 data/ 給人工匯入來源（P1-T13；manual_import 讀 /data）
      - ../migrations:/infra/migrations:ro
      - ../../config:/config:ro
      - ../../skills:/skills:ro
      - ../../data:/data:ro
    healthcheck:
      # worker 正在執行擷取時仍會回應 ping（由主行程處理）
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3

  # Celery beat（P1-T07）：每 60 秒派工一次。排程狀態檔放 /tmp（映像的 /app 不可寫）。
  beat:
    <<: *backend
    command:
      [
        "celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO",
        "--schedule", "/tmp/celerybeat-schedule",
      ]
    healthcheck:
      # beat 至少每 5 分鐘醒來一次並同步排程狀態檔；10 分鐘沒更新視為停擺
      test:
        [
          "CMD", "python", "-c",
          "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/celerybeat-schedule') > 600)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ../../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
