# Alembic 設定。在 backend/ 執行：uv run alembic upgrade head
# 連線資訊不寫在這裡：env.py 由 app.core.config.Settings 讀取（.env 的 POSTGRES_*）。

[alembic]
script_location = %(here)s/../infra/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
