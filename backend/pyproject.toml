[project]
name = "ncu-resilience-backend"
version = "0.1.0"
description = "NCU Resilience AI 後端（FastAPI 模組化單體）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3,<6",
    "fastapi>=0.143.3",
    "feedparser>=6.0.14",
    "httpx2>=2.13.1",
    "jsonschema>=4.23",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.2",
    "selectolax>=0.4.13,<1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允許中文全形標點

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # 測試用假帳密

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"  # 第三方套件缺型別時的自寫 stub（stubs/）
