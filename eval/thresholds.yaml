# 評測指標與門檻（P2-T05；使用者 2026-10-20 決定集中在這個檔案）。
# 門檻數字依 docs/plan/execution-plan.md 的 P2 門檻表；修改門檻要由使用者決定並寫 ADR，
# 不得為了通過評測而調低（AGENTS.md 不可違反的規則 2）。
#
# 指標類型（app/ai/eval/metrics.py）：
#   macro_f1        各類別 F1 的平均（field 為類別欄位，null 也算一類）
#   f1／precision／recall  以 positive 為正類（field 的值等於 positive）
#   accuracy        field 完全相等的比例
# gold 取自 golden case 的 expected[field]；沒有該欄位的 case 不計入。
#   unsupported_count（P2-T10）  輸出的 field 等於 positive、卻沒有支持證據的次數；以 max（≤）判定

version: 1

# 全部 Skill 共用（計畫：Schema 合格率 ≥ 99%；G2-2 事實性結論 100% 可追溯或 abstain）
global:
  schema_pass_rate: 0.99
  traceability: 1.0

skills:
  # 模板（ADR-0013）：示範用，門檻比照 S03
  template:
    metrics:
      - name: macro_f1
        type: macro_f1
        field: announcement_type
        threshold: 0.85

  # S01（P2-T06）：相關性 F1 ≥ 0.90（正類為「相關」）
  relevance-filter:
    metrics:
      - name: f1
        type: f1
        field: is_campus_relevant
        positive: true
        threshold: 0.90

  # S02（P2-T07）：時間（開始日期）、地點欄位正確率 ≥ 0.85；證據可追溯 100% 由 global 檢查
  event-extractor:
    metrics:
      - name: start_date_accuracy
        type: accuracy
        field: occurrence_start_date
        threshold: 0.85
      - name: location_accuracy
        type: accuracy
        field: location
        threshold: 0.85

  # S03（P2-T08）：9 類（含 none）的 Macro-F1 ≥ 0.85；abstain 案例沒有 category，不計入
  event-classifier:
    metrics:
      - name: macro_f1
        type: macro_f1
        field: category
        threshold: 0.85

  # S04（P2-T09）：同事件 precision ≥ 0.95、recall ≥ 0.85。
  # 每筆 case 是一對（新文章, 候選事件），以 relation = same_event 為正類；
  # 等同「是否合併這一對」的配對式指標。abstain 案例沒有 relation，不計入。
  event-linker:
    metrics:
      - name: same_event_precision
        type: precision
        field: relation
        positive: same_event
        threshold: 0.95
      - name: same_event_recall
        type: recall
        field: relation
        positive: same_event
        threshold: 0.85

  # S05（P2-T10）：無 evidence_ids 被標 verified 的次數 = 0（規格 A08）。
  # 計次指標以 max（≤）判定：模型建議 verified、卻沒有任何「被引用且立場為 supports」的證據，就算一次。
  # 最終查證狀態由 app/verification/rules.py 決定，規則本身保證不會發生（tests/unit/verification）。
  evidence-verifier:
    metrics:
      - name: verified_without_evidence
        type: unsupported_count
        field: suggested_status
        positive: verified
        max: 0

  # 以下在各 Skill 的任務中，依其輸出欄位加入（門檻照計畫表）：
  #   risk-assessor（P2-T11）     高風險 recall ≥ 0.95；同輸入結果重現 100%
  #   root-cause-analyst／solution-planner（P2-T12）  人工審閱：假設與事實區分正確率 ≥ 0.90
